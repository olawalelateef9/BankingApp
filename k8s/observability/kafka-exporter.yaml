apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      containers:
      - name: kafka-exporter
        image: danielqsj/kafka-exporter:latest
        args: ["--kafka.server=kafka-service:9092"]
        ports:
        - name: metrics
          containerPort: 9308
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: banking
  labels:
    app: kafka-exporter
spec:
  ports:
  - name: metrics
    port: 9308
    targetPort: 9308
  selector:
    app: kafka-exporter
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kafka-exporter-monitor
  namespace: monitoring # Or 'banking' depending on where your Prometheus looks
  labels:
    release: monitoring # Matches the label your Prometheus instance expects
spec:
  selector:
    matchLabels:
      app: kafka-exporter
  namespaceSelector:
    matchNames:
      - banking
  endpoints:
  - port: metrics
    interval: 30s