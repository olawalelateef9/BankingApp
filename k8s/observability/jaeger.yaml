apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: banking
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.57
        ports:
        - containerPort: 6831
          protocol: UDP
          name: jaeger-compact
        - containerPort: 6832
          protocol: UDP
          name: jaeger-binary
        - containerPort: 5778
          name: configs
        - containerPort: 16686
          name: frontend
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        - containerPort: 14268
          name: jaeger-http
        - containerPort: 9411
          name: zipkin
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: banking
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
  - name: jaeger-compact
    port: 6831
    protocol: UDP
  - name: jaeger-binary
    port: 6832
    protocol: UDP
  - name: configs
    port: 5778
  - name: frontend
    port: 16686
  - name: otlp-grpc
    port: 4317
  - name: otlp-http
    port: 4318
  - name: jaeger-http
    port: 14268
  - name: zipkin
    port: 9411