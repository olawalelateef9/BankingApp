apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: transaction-service-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app: transaction-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      relabelings:
        - targetLabel: application
          replacement: transaction-service