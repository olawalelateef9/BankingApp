apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: user-service-monitor
  namespace: monitoring
  labels:
    release: monitoring 
spec:
  namespaceSelector:
    any: true 
  selector:
    matchLabels:
      app: user-service
  endpoints:
  - port: http
    path: /metrics    # Python standard
    interval: 15s