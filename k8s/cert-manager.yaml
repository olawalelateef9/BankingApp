---
# DuckDNS API token secret
apiVersion: v1
kind: Secret
metadata:
  name: duckdns-token
  namespace: cert-manager
type: Opaque
stringData:
  token: "b5149cbf-73d7-4f48-9f60-11963ae2b8bb"

---
# ClusterIssuer — Let's Encrypt production
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: olawalelateef9@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.duckdns.org
            solverName: duckdns
            config:
              token: b5149cbf-73d7-4f48-9f60-11963ae2b8bb

---
# Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: techbleatglobalbank-tls
  namespace: banking
spec:
  secretName: techbleatglobalbank-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - techbleatglobalbank.duckdns.org