apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-ingress-frontend
  namespace: banking
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-url: "https://techbleatglobalbank.duckdns.org/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://techbleatglobalbank.duckdns.org/oauth2/start?rd=$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email,Authorization"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - techbleatglobalbank.duckdns.org
      secretName: techbleatglobalbank-tls
  rules:
    - host: techbleatglobalbank.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-ingress-oauth2
  namespace: banking
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - techbleatglobalbank.duckdns.org
      secretName: techbleatglobalbank-tls
  rules:
    - host: techbleatglobalbank.duckdns.org
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 4180
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-ingress-api
  namespace: banking
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/auth-url: "https://techbleatglobalbank.duckdns.org/oauth2/auth"
    # No auth-signin here: API calls are fetch() requests, which can't follow a
    # redirect to the Cognito login page. They get a 401 and the frontend
    # sends the whole page to /oauth2/start instead.
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email,Authorization"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - techbleatglobalbank.duckdns.org
      secretName: techbleatglobalbank-tls
  rules:
    - host: techbleatglobalbank.duckdns.org
      http:
        paths:
          - path: /api/users(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: user-service
                port:
                  number: 8000
          - path: /api/transactions(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: transaction-service
                port:
                  number: 8080
          - path: /api/activities(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: activity-service-external
                port:
                  number: 8001
