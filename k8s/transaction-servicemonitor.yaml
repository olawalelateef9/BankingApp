apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: transaction-service-monitor
  namespace: monitoring
  labels:
    release: kps                    # MUST match kube-prometheus-stack release name
spec:
  namespaceSelector:
    any: true                       # fine for Docker Desktop; will find services in 'banking'
  selector:
    matchLabels:
      app: transaction-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s