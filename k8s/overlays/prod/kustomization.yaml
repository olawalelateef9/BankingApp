apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: banking-prod

resources:
  - ../../base

labels:
  - pairs:
      environment: prod
    includeSelectors: false

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
  # Redis (oauth2-proxy sessions) and Kafka are single-instance stores
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: (redis|kafka)

images:
  - name: olawale9/bank-frontend
    newTag: "1.5"
  - name: olawale9/user-service
    newTag: "1.3"
  - name: olawale9/transaction-service
    newTag: "1.6"
  - name: olawale9/activity-service
    newTag: "1.1"
